<!-- Paste this into Supabase Authentication > Email Templates > Reset password. -->
<div style="margin:0;padding:36px 16px;background:#090909;color:#f4f4f4;font-family:Arial,sans-serif">
  <div style="max-width:560px;margin:0 auto;padding:32px 26px;background:#111;border:1px solid #2b2b2b;border-radius:12px">
    <p style="font-size:12px;letter-spacing:3px;color:#aaa">BADLUCKDEPT.</p>
    <div style="height:1px;background:#333;margin:24px 0"></div>
    <p style="font-size:10px;letter-spacing:2px;color:#999">ACCOUNT SECURITY</p>
    <h1 style="font-size:28px;letter-spacing:-1px">Reset your password.</h1>
    <p style="color:#c3c3c3;line-height:1.7">We received a request to reset the password for your BadLuckDept account. Use the button below to choose a new one.</p>
    <p style="margin:28px 0"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#f2f2f2;color:#090909;text-decoration:none;padding:13px 18px;border-radius:6px;font-weight:bold">Reset password</a></p>
    <p style="font-size:11px;line-height:1.6;color:#777">If you didn't request a password reset, ignore this email. Your password won't change unless you use the link.</p>
  </div>
</div>
